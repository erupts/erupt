<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        /* soft, low-contrast skin — intentionally theme-agnostic */
        :root {
            --ink: rgba(15, 35, 95, .55);       /* skeleton bars, marks          */
            --line: rgba(15, 35, 95, .16);      /* structural borders            */
            --ink-4: rgba(15, 35, 95, .10);     /* row hairlines                 */
            --paper: #FFFFFF;
            --cream: rgba(15, 35, 95, .028);
            --accent: rgba(22, 119, 255, .80);

            --c-brand: rgba(22, 119, 255, .15);
            --c-active: rgba(22, 119, 255, .08);
            --c-avatar: rgba(22, 119, 255, .25);
            --c-btn: rgba(22, 119, 255, .62);
            --btn-bar: rgba(255, 255, 255, .90);
            --c-prog: rgba(22, 119, 255, .55);
            --c-tag-ok: rgba(82, 196, 26, .28);
            --c-tag-warn: rgba(250, 173, 20, .30);
            --c-dot: rgba(255, 77, 79, .65);
            --c-act2: rgba(255, 77, 79, .45);
            --c-pager-on: rgba(22, 119, 255, .15);
            --rover-bg: rgba(22, 119, 255, .07);

            --bw: 1px;
            --sh: 0 24px 64px -40px rgba(15, 43, 92, .30);
            --sh-sm: 0 2px 10px -4px rgba(15, 43, 92, .25);
            --focus-line: rgba(22, 119, 255, .55);
            --focus-sh: 0 0 0 3px rgba(22, 119, 255, .08);

            --r-lg: 10px;
            --r: 6px;
            --r-sm: 4px;
            --r-bar: 3px;
            --r-xs: 2px;
            --r-dot: 50%;
        }

        body {
            /* same backdrop as the app preloader (index.html) */
            background: #fff url('assets/passport/passport-bg.svg') no-repeat center center / cover;
            overflow: hidden;
        }

        @keyframes rise {
            from { opacity: 0; transform: translate(4px, 6px); }
            to   { opacity: 1; transform: none; }
        }
        @keyframes stamp {
            0%   { opacity: 0; transform: translate(6px, 6px); box-shadow: none; }
            60%  { opacity: 1; transform: translate(-1px, -1px); box-shadow: var(--sh-sm); }
            100% { opacity: 1; transform: none; box-shadow: var(--sh-sm); }
        }
        @keyframes fade { to { opacity: 1; } }

        .ent {
            opacity: 0;
            animation: rise .55s cubic-bezier(.22, 1, .36, 1) forwards;
        }
        .fad {
            opacity: 0;
            animation: fade .6s ease forwards;
        }
        .stmp {
            opacity: 0;
            animation: stamp .5s cubic-bezier(.22, 1, .36, 1) forwards;
        }

        /* ================= the artboard: ghost erupt page ================= */
        .board {
            position: fixed;
            left: 8%; right: 8%;
            top: 8%; bottom: 8%;
            background: var(--paper);
            border: var(--bw) solid var(--line);
            border-radius: var(--r-lg);
            box-shadow: var(--sh);
            animation-delay: .1s;
        }

        /* top bar */
        .tbar {
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 48px;
            border-bottom: var(--bw) solid var(--line);
        }

        /* brand block (no text, just a solid tile) */
        .brand {
            position: absolute;
            left: 16px; top: 12px;
            width: 24px; height: 24px;
            background: var(--c-brand);
            border: var(--bw) solid var(--line);
            border-radius: var(--r-sm);
            box-shadow: var(--sh-sm);
            animation-delay: .25s;
        }
        .brand::before {
            content: "";
            position: absolute;
            left: 4px; top: 4px;
            width: 12px; height: 12px;
            border: var(--bw) solid var(--line);
            border-radius: var(--r-xs);
            background: var(--paper);
        }

        /* breadcrumbs */
        .crumbs {
            position: absolute;
            left: 62px; top: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation-delay: .55s;
        }
        .crumbs b {
            display: block;
            height: 8px;
            border-radius: var(--r-bar);
            background: var(--ink);
        }
        .crumbs b:nth-child(1) { width: 34px; opacity: .28; }
        .crumbs b:nth-child(3) { width: 48px; opacity: .28; }
        .crumbs b:nth-child(5) { width: 38px; }
        .crumbs i {
            display: block;
            width: 6px; height: 2px;
            background: var(--ink);
            opacity: .5;
        }

        /* top-right: bell + avatar tile */
        .tools {
            position: absolute;
            right: 16px; top: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation-delay: .7s;
        }
        .tools .bell {
            position: relative;
            width: 20px; height: 24px;
        }
        .tools .bell::before {
            content: "";
            position: absolute;
            left: 2px; top: 2px;
            width: 16px; height: 16px;
            border: var(--bw) solid var(--line);
            border-radius: 50% 50% 2px 2px;
            background: var(--paper);
        }
        .tools .bell::after {
            content: "";
            position: absolute;
            right: -1px; top: 0;
            width: 8px; height: 8px;
            background: var(--c-dot);
            border: var(--bw) solid var(--line);
            border-radius: var(--r-dot);
            animation: dot-pulse 5s ease-out 3s infinite;
        }
        @keyframes dot-pulse {
            0%, 88%, 100% { transform: scale(1); }
            92%           { transform: scale(1.35); }
        }
        .tools .avatar {
            width: 24px; height: 24px;
            border: var(--bw) solid var(--line);
            border-radius: var(--r-sm);
            background: var(--c-avatar);
            box-shadow: var(--sh-sm);
            position: relative;
        }
        .tools .avatar::before {
            content: "";
            position: absolute;
            left: 5px; top: 3px;
            width: 10px; height: 5px;
            border-radius: 50% 50% 0 0;
            background: var(--ink);
        }
        .tools .avatar::after {
            content: "";
            position: absolute;
            left: 2px; bottom: 2px;
            right: 2px; height: 6px;
            border-radius: 50% 50% 0 0;
            background: var(--ink);
        }

        /* sidebar */
        .side {
            position: absolute;
            left: 0; top: 48px; bottom: 0;
            width: 170px;
            background: #fff;
            border-right: var(--bw) solid var(--line);
            border-radius: 0 0 0 var(--r-lg);
        }
        .mi {
            position: absolute;
            left: 12px; right: 12px;
            height: 32px;
            border: var(--bw) solid transparent;
            border-radius: var(--r);
        }
        .mi s {
            position: absolute;
            left: 8px; top: 7px;
            width: 14px; height: 14px;
            border: var(--bw) solid var(--line);
            border-radius: var(--r-xs);
            background: var(--paper);
        }
        .mi b {
            position: absolute;
            left: 32px; top: 12px;
            height: 8px;
            border-radius: var(--r-bar);
            background: var(--ink);
            opacity: .22;
        }
        .m1 { top: 18px;  animation-delay: .8s; } .m1 b { width: 62px; }
        .m2 { top: 58px;  animation-delay: .9s; } .m2 b { width: 82px; }
        .m3 { top: 98px;  animation-delay: 1s; }  .m3 b { width: 54px; }
        .m4 { top: 138px; animation-delay: 1.1s; } .m4 b { width: 74px; }
        .m5 { top: 178px; animation-delay: 1.2s; } .m5 b { width: 58px; }

        /* active menu item */
        .mi.on {
            background: var(--c-active);
            border-color: var(--line);
            box-shadow: var(--sh-sm);
        }
        .mi.on s {
            background: var(--paper);
            border-color: var(--line);
        }
        .mi.on b {
            background: var(--ink);
            opacity: 1;
        }

        /* ================= main region ================= */
        .main {
            position: absolute;
            left: 170px; right: 0; top: 48px; bottom: 0;
        }

        /* query bar */
        .query {
            position: absolute;
            left: 22px; right: 22px; top: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation-delay: 1.15s;
        }
        .query .qbox {
            position: relative;
            width: 170px; height: 32px;
            border: var(--bw) solid var(--line);
            border-radius: var(--r);
            background: var(--paper);
        }
        .query .qbox.focus {
            border-color: var(--focus-line);
            box-shadow: var(--focus-sh);
        }
        .caret {
            position: absolute;
            left: 10px; top: 8px;
            width: 2px; height: 16px;
            background: var(--accent);
            animation: blink 1.1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .query .qbox .ph {
            position: absolute;
            left: 10px; top: 13px;
            width: 52%; height: 6px;
            border-radius: var(--r-bar);
            background: var(--ink);
            opacity: .18;
        }
        .query .qbox .chev {
            position: absolute;
            right: 10px; top: 12px;
            width: 6px; height: 6px;
            border-right: var(--bw) solid var(--ink);
            border-bottom: var(--bw) solid var(--ink);
            transform: rotate(45deg);
        }
        .query .spacer { flex: 1; }
        .btn {
            position: relative;
            width: 68px; height: 32px;
            border: var(--bw) solid var(--line);
            border-radius: var(--r);
        }
        .btn::before {
            content: "";
            position: absolute;
            left: 50%; top: 13px;
            width: 28px; height: 6px;
            margin-left: -14px;
            border-radius: var(--r-bar);
        }
        .btn.plain {
            background: var(--paper);
        }
        .btn.plain::before { background: var(--ink); opacity: .30; }
        .btn.primary {
            background: var(--c-btn);
            border-color: var(--focus-line);
            box-shadow: var(--sh-sm);
            animation: btn-nudge 6s ease-in-out 3s infinite;
        }
        .btn.primary::before { background: var(--btn-bar); }
        @keyframes btn-nudge {
            0%, 88%, 100% { transform: none; box-shadow: var(--sh-sm); }
            92%           { transform: translate(2px, 2px); box-shadow: none; }
        }

        /* ================= table card ================= */
        .card {
            position: absolute;
            left: 22px; right: 22px; top: 76px;
            border: var(--bw) solid var(--line);
            border-radius: var(--r);
            background: var(--paper);
            overflow: hidden;
            animation-delay: 1.35s;
        }
        .thead {
            position: relative;
            height: 34px;
            background: var(--cream);
            border-bottom: var(--bw) solid var(--line);
        }
        .thead .sort {
            position: absolute;
            left: calc(7% + 34px); top: 10px;
            width: 0; height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 6px solid var(--ink);
        }
        .thead .sort::after {
            content: "";
            position: absolute;
            left: -4px; top: 9px;
            width: 0; height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 6px solid var(--ink);
            opacity: .25;
        }
        .trow {
            position: relative;
            height: 34px;
            border-bottom: 1px solid var(--ink-4);
            opacity: 0;
            animation: fade .5s ease forwards;
        }
        .trow:last-of-type { border-bottom: none; }
        .trow:nth-child(2) { animation-delay: 1.55s; }
        .trow:nth-child(3) { animation-delay: 1.65s; }
        .trow:nth-child(4) { animation-delay: 1.75s; }
        .trow:nth-child(5) { animation-delay: 1.85s; }
        .trow:nth-child(6) { animation-delay: 1.95s; }
        .trow:nth-child(7) { animation-delay: 2.05s; }

        .cb {
            position: absolute;
            left: 12px; top: 10px;
            width: 14px; height: 14px;
            border: var(--bw) solid var(--line);
            border-radius: var(--r-xs);
            background: var(--paper);
        }
        .cb.on {
            background: var(--c-tag-ok);
        }
        .cb.on::before {
            content: "";
            position: absolute;
            left: 2px; top: 0;
            width: 4px; height: 8px;
            border: solid var(--ink);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .cell {
            position: absolute;
            top: 15px;
            height: 6px;
            border-radius: var(--r-bar);
            background: var(--ink);
            opacity: .14;
        }
        .thead .cell { background: var(--ink); opacity: .5; top: 14px; }
        .cc1 { left: 7%;  width: 26px; }
        .cc2 { left: 20%; width: 14%; }
        .trow .cc2 { left: calc(20% + 24px); }
        .cc3 { left: 47%; width: 9%; }
        .cc4 { left: 64%; width: 30px; }
        .trow:nth-child(odd)  .cc2 { width: 10%; }
        .trow:nth-child(even) .cc1 { width: 20px; }

        .ava {
            position: absolute;
            left: 20%; top: 8px;
            width: 18px; height: 18px;
            border: var(--bw) solid var(--line);
            border-radius: var(--r-sm);
            background: var(--cream);
        }
        .trow:first-of-type .ava,
        .trow:nth-child(5)  .ava { background: var(--c-active); }
        .trow:nth-child(3)  .ava { background: var(--c-tag-warn); }
        .trow:nth-child(6)  .ava { background: var(--c-avatar); }

        /* tag pill */
        .tag {
            position: absolute;
            left: 47%; top: 8px;
            width: 46px; height: 18px;
            border: var(--bw) solid var(--line);
            border-radius: var(--r-sm);
            background: var(--c-tag-ok);
        }
        .tag::before {
            content: "";
            position: absolute;
            left: 4px; top: 5px;
            width: 22px; height: 4px;
            border-radius: var(--r-xs);
            background: var(--ink);
        }
        .tag.grey  { background: var(--paper); }
        .tag.grey::before { background: var(--ink); opacity: .35; }
        .tag.warn  { background: var(--c-tag-warn); }

        /* progress bar */
        .prog {
            position: absolute;
            left: 64%; top: 14px;
            width: 14%; height: 8px;
            border: var(--bw) solid var(--line);
            border-radius: var(--r-bar);
            background: var(--paper);
            overflow: hidden;
        }
        .prog::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: var(--p, 50%);
            background: var(--c-prog);
            transform: scaleX(0);
            transform-origin: left center;
            animation: prog-in .9s cubic-bezier(.4, 0, .2, 1) 2.2s forwards;
        }
        @keyframes prog-in { to { transform: scaleX(1); } }

        .act, .act2 {
            position: absolute;
            top: 15px;
            height: 6px;
            border-radius: var(--r-bar);
        }
        .act  { right: 44px; width: 20px; background: var(--ink); opacity: .55; }
        .act2 { right: 14px; width: 20px; background: var(--c-act2); }

        /* roving row highlight */
        .rover {
            position: absolute;
            left: 0; right: 0;
            height: 34px;
            background: var(--rover-bg);
            border-top: var(--bw) solid var(--line);
            border-bottom: var(--bw) solid var(--line);
            box-shadow: inset 3px 0 0 var(--accent);
            opacity: 0;
            animation: rove 16s steps(1) 3s infinite;
            pointer-events: none;
        }
        @keyframes rove {
            0%          { top: 34px;  opacity: 0; }
            2%, 15%     { top: 34px;  opacity: 1; }
            17%, 30%    { top: 68px;  opacity: 1; }
            32%, 45%    { top: 102px; opacity: 1; }
            47%, 60%    { top: 136px; opacity: 1; }
            62%, 75%    { top: 170px; opacity: 1; }
            77%, 92%    { top: 204px; opacity: 1; }
            94%, 100%   { top: 204px; opacity: 0; }
        }

        /* pagination */
        .pager {
            position: absolute;
            right: 22px; bottom: 22px;
            display: flex;
            gap: 8px;
            animation-delay: 2.2s;
        }
        .pager s {
            display: block;
            width: 24px; height: 24px;
            border: var(--bw) solid var(--line);
            border-radius: var(--r-sm);
            background: var(--paper);
            position: relative;
        }
        .pager s::before {
            content: "";
            position: absolute;
            left: 50%; top: 50%;
            width: 8px; height: 4px;
            margin: -2px 0 0 -4px;
            background: var(--ink);
            opacity: .30;
        }
        .pager s.on {
            background: var(--c-pager-on);
            box-shadow: var(--sh-sm);
        }
        .pager s.on::before { opacity: 1; }
    </style>
</head>
<body>
    <!-- artboard: ghost erupt page -->
    <div class="board ent">
        <!-- top bar -->
        <div class="tbar">
            <div class="brand stmp"></div>
            <div class="crumbs fad">
                <b></b><i></i><b></b><i></i><b></b>
            </div>
            <div class="tools fad">
                <span class="bell"></span>
                <span class="avatar"></span>
            </div>
        </div>

        <!-- sidebar -->
        <div class="side">
            <div class="mi m1 fad"><s></s><b></b></div>
            <div class="mi m2 on fad"><s></s><b></b></div>
            <div class="mi m3 fad"><s></s><b></b></div>
            <div class="mi m4 fad"><s></s><b></b></div>
            <div class="mi m5 fad"><s></s><b></b></div>
        </div>

        <!-- main -->
        <div class="main">
            <div class="query ent">
                <div class="qbox focus"><span class="caret"></span></div>
                <div class="qbox"><span class="ph"></span><span class="chev"></span></div>
                <div class="spacer"></div>
                <div class="btn plain"></div>
                <div class="btn primary"></div>
            </div>

            <div class="card ent">
                <div class="thead">
                    <span class="cb"></span>
                    <span class="cell cc1"></span><span class="sort"></span>
                    <span class="cell cc2"></span>
                    <span class="cell cc3"></span>
                    <span class="cell cc4"></span>
                </div>
                <div class="trow">
                    <span class="cb on"></span>
                    <span class="cell cc1"></span><span class="ava"></span><span class="cell cc2"></span>
                    <span class="tag"></span><span class="prog" style="--p:72%"></span>
                    <span class="act"></span><span class="act2"></span>
                </div>
                <div class="trow">
                    <span class="cb"></span>
                    <span class="cell cc1"></span><span class="ava"></span><span class="cell cc2"></span>
                    <span class="tag grey"></span><span class="prog" style="--p:38%"></span>
                    <span class="act"></span><span class="act2"></span>
                </div>
                <div class="trow">
                    <span class="cb"></span>
                    <span class="cell cc1"></span><span class="ava"></span><span class="cell cc2"></span>
                    <span class="tag warn"></span><span class="prog" style="--p:56%"></span>
                    <span class="act"></span><span class="act2"></span>
                </div>
                <div class="trow">
                    <span class="cb"></span>
                    <span class="cell cc1"></span><span class="ava"></span><span class="cell cc2"></span>
                    <span class="tag grey"></span><span class="prog" style="--p:84%"></span>
                    <span class="act"></span><span class="act2"></span>
                </div>
                <div class="trow">
                    <span class="cb"></span>
                    <span class="cell cc1"></span><span class="ava"></span><span class="cell cc2"></span>
                    <span class="tag"></span><span class="prog" style="--p:47%"></span>
                    <span class="act"></span><span class="act2"></span>
                </div>
                <div class="trow">
                    <span class="cb"></span>
                    <span class="cell cc1"></span><span class="ava"></span><span class="cell cc2"></span>
                    <span class="tag grey"></span><span class="prog" style="--p:63%"></span>
                    <span class="act"></span><span class="act2"></span>
                </div>
                <div class="rover"></div>
            </div>

            <div class="pager ent">
                <s></s><s class="on"></s><s></s><s></s>
            </div>
        </div>
    </div>
</body>
</html>
