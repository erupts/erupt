<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        /* Blueprint canvas with the signed-in user drawn on the artboard.
           Dot-grid paper, guide lines growing out of the shell's header and sidebar
           edges, crosses where they meet, corner ticks — and inside the frame a
           panel that greets the current user, counts what they can reach, and lets
           them jump to their pinned menus. Data: /erupt-api/userinfo, /erupt-api/menu,
           /erupt-api/notice/unread-count; the shell hands this frame its token and
           language on the URL (see routes/home/home.component). */
        :root {
            --line: rgba(0, 0, 0, 0.10);
            --line-strong: rgba(0, 0, 0, 0.18);
            --dot: rgba(0, 0, 0, 0.09);
            --tint: rgba(22, 119, 255, 0.06);
            --accent: #1677ff;
            --accent-soft: rgba(22, 119, 255, 0.10);
            --accent-line: rgba(22, 119, 255, 0.35);
            --text: rgba(0, 0, 0, 0.85);
            --text-2: rgba(0, 0, 0, 0.55);
            --text-3: rgba(0, 0, 0, 0.38);
            --panel: rgba(255, 255, 255, 0.72);
            --panel-line: rgba(0, 0, 0, 0.08);
            --tile: rgba(255, 255, 255, 0.55);
            --tile-hover: rgba(255, 255, 255, 0.9);
            --sheen: rgba(255, 255, 255, 0.55);
            --shadow: 0 30px 80px -40px rgba(15, 43, 92, 0.35);
        }
        html.dark {
            --line: rgba(255, 255, 255, 0.10);
            --line-strong: rgba(255, 255, 255, 0.20);
            --dot: rgba(255, 255, 255, 0.09);
            --tint: rgba(22, 119, 255, 0.10);
            --text: rgba(255, 255, 255, 0.88);
            --text-2: rgba(255, 255, 255, 0.60);
            --text-3: rgba(255, 255, 255, 0.38);
            --panel: rgba(28, 30, 36, 0.62);
            --panel-line: rgba(255, 255, 255, 0.10);
            --tile: rgba(255, 255, 255, 0.05);
            --tile-hover: rgba(255, 255, 255, 0.10);
            --sheen: rgba(255, 255, 255, 0.10);
            --shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.8);
        }

        /* No backdrop on purpose: the shell paints one behind this frame (plain,
           dark, or the Liquid Glass field). The dot grid is transparent between dots. */
        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(1200px 700px at 0% 0%, var(--tint), transparent 60%),
                radial-gradient(circle, var(--dot) 1px, transparent 1.4px);
            background-size: auto, 24px 24px;
            background-position: 0 0, 12px 12px;
        }

        /* ── guide lines: horizontals grow from the sidebar edge, verticals from the header ── */
        .h, .v { position: fixed; background: var(--line); }
        .h { left: 0; right: 0; height: 1px; transform-origin: left center; transform: scaleX(0);
             animation: grow-x 1.6s cubic-bezier(.22, 1, .36, 1) forwards; }
        .v { top: 0; bottom: 0; width: 1px; transform-origin: center top; transform: scaleY(0);
             animation: grow-y 1.6s cubic-bezier(.22, 1, .36, 1) forwards; }
        @keyframes grow-x { to { transform: scaleX(1); } }
        @keyframes grow-y { to { transform: scaleY(1); } }
        .h1 { top: 18%;  animation-delay: .10s; }
        .h2 { top: 82%;  animation-delay: .35s; }
        .v1 { left: 14%; animation-delay: .20s; }
        .v2 { left: 86%; animation-delay: .45s; }

        /* crosses at the intersections */
        .x { position: fixed; width: 11px; height: 11px; margin: -5px 0 0 -5px; opacity: 0;
             animation: fade .6s ease forwards; }
        .x::before, .x::after { content: ""; position: absolute; background: var(--line-strong); }
        .x::before { left: 0; right: 0; top: 5px; height: 1px; }
        .x::after  { top: 0; bottom: 0; left: 5px; width: 1px; }
        @keyframes fade { to { opacity: 1; } }
        .x11 { top: 18%; left: 14%; animation-delay: 1.4s; }
        .x12 { top: 18%; left: 86%; animation-delay: 1.5s; }
        .x21 { top: 82%; left: 14%; animation-delay: 1.6s; }
        .x22 { top: 82%; left: 86%; animation-delay: 1.7s; }

        /* corner ticks just outside the frame */
        .tick { position: fixed; width: 14px; height: 14px; opacity: 0; animation: fade .5s ease forwards; }
        .tick::before, .tick::after { content: ""; position: absolute; background: var(--line-strong); }
        .tick::before { width: 14px; height: 1px; }
        .tick::after  { width: 1px;  height: 14px; }
        .t1 { top: calc(18% - 20px); left: calc(14% - 20px); animation-delay: 1.8s; }
        .t1::before { bottom: 0; right: 0; } .t1::after { bottom: 0; right: 0; }
        .t2 { top: calc(18% - 20px); right: calc(14% - 20px); animation-delay: 1.9s; }
        .t2::before { bottom: 0; left: 0; }  .t2::after { bottom: 0; left: 0; }
        .t3 { bottom: calc(18% - 20px); left: calc(14% - 20px); animation-delay: 2.0s; }
        .t3::before { top: 0; right: 0; }    .t3::after { top: 0; right: 0; }
        .t4 { bottom: calc(18% - 20px); right: calc(14% - 20px); animation-delay: 2.1s; }
        .t4::before { top: 0; left: 0; }     .t4::after { top: 0; left: 0; }

        /* glide: a short light runs along the upper guide */
        .glide { position: fixed; top: 18%; left: 0; width: 22%; height: 1px;
                 background: linear-gradient(90deg, transparent, var(--accent-line) 60%, transparent);
                 opacity: 0; animation: glide 9s cubic-bezier(.4, 0, .2, 1) 2.6s infinite; }
        @keyframes glide {
            0%        { transform: translateX(-100%); opacity: 0; }
            4%, 34%   { opacity: 1; }
            40%, 100% { transform: translateX(460%); opacity: 0; }
        }

        /* ── the artboard: the user's panel ───────────────────────────────── */
        .board {
            position: fixed;
            top: 18%; bottom: 18%;
            left: 14%; right: 14%;
            perspective: 1400px;
            opacity: 0;
            animation: fade .8s ease 1.1s forwards;
        }
        .panel {
            position: relative;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            padding: clamp(16px, 3.2vh, 28px) clamp(18px, 3vw, 34px);
            background: var(--panel);
            border: 1px solid var(--panel-line);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
            transition: transform 0.1s linear;
            overflow: hidden;
        }
        /* specular sheen that follows the pointer */
        .panel::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(420px 280px at var(--mx, 50%) var(--my, 50%), var(--sheen), transparent 70%);
            opacity: 0.6;
            transition: opacity 0.4s;
        }
        .panel.idle::after { opacity: 0; }

        /* who */
        .who {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            padding-right: 170px; /* keeps the greeting clear of the corner toolbar */
        }
        .avatar {
            position: relative;
            width: 56px; height: 56px;
            border-radius: 16px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 22px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 0 1px var(--accent-line);
            animation: pop .6s cubic-bezier(.22, 1, .36, 1) 1.3s both;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        @keyframes pop { from { transform: scale(.6); opacity: 0; } }
        .who .txt { min-width: 0; flex: 1; }
        .hello {
            font-size: clamp(18px, 2.6vh, 24px);
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            animation: rise .6s cubic-bezier(.22, 1, .36, 1) 1.4s both;
        }
        .hello b { color: var(--accent); font-weight: 600; }
        .sub {
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-3);
            display: flex; align-items: center; gap: 10px;
            animation: rise .6s cubic-bezier(.22, 1, .36, 1) 1.5s both;
        }
        .sub .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
        .clock { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

        /* stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
            gap: 12px;
            margin-top: clamp(14px, 3vh, 26px);
            flex-shrink: 0;
        }
        .stat {
            position: relative;
            padding: 12px 14px;
            border: 1px solid var(--panel-line);
            background: var(--tile);
            cursor: default;
            transition: transform .25s cubic-bezier(.22, 1, .36, 1), background .25s, border-color .25s;
            animation: rise .6s cubic-bezier(.22, 1, .36, 1) both;
        }
        .stat:nth-child(1) { animation-delay: 1.6s; }
        .stat:nth-child(2) { animation-delay: 1.68s; }
        .stat:nth-child(3) { animation-delay: 1.76s; }
        .stat:nth-child(4) { animation-delay: 1.84s; }
        .stat:hover { transform: translateY(-3px); background: var(--tile-hover); border-color: var(--accent-line); }
        .stat.go { cursor: pointer; }
        .stat .n {
            font-size: clamp(20px, 3.4vh, 28px);
            font-weight: 600;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }
        .stat .n.badge { color: var(--accent); }
        .stat .l { margin-top: 6px; font-size: 12px; color: var(--text-3); }
        .stat .l::before {
            content: "";
            display: inline-block;
            width: 8px; height: 1px;
            margin-right: 6px;
            vertical-align: middle;
            background: var(--line-strong);
        }

        /* quick access */
        .quick, .recent {
            margin-top: clamp(14px, 3vh, 26px);
            min-height: 0;
            display: flex;
            flex-direction: column;
            animation: rise .6s cubic-bezier(.22, 1, .36, 1) 1.95s both;
        }
        .quick { flex-shrink: 0; }
        .recent { flex: 1; animation-delay: 2.1s; }
        .qh {
            display: flex; align-items: center; gap: 10px;
            font-size: 12px; color: var(--text-3);
            flex-shrink: 0;
        }
        .qh::after { content: ""; flex: 1; height: 1px; background: var(--line); }
        .chips {
            margin-top: 10px;
            display: flex; flex-wrap: wrap; gap: 8px;
            overflow: auto;
            padding-bottom: 2px;
        }
        .chip {
            display: inline-flex; align-items: center; gap: 8px;
            max-width: 100%;
            padding: 6px 12px 6px 8px;
            border: 1px solid var(--panel-line);
            background: var(--tile);
            font-size: 13px;
            color: var(--text-2);
            cursor: pointer;
            user-select: none;
            transition: transform .2s cubic-bezier(.22, 1, .36, 1), background .2s, border-color .2s, color .2s;
        }
        .chip .k {
            width: 20px; height: 20px;
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 11px; font-weight: 600;
            flex-shrink: 0;
        }
        .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chip:hover { transform: translateY(-2px); background: var(--tile-hover); border-color: var(--accent-line); color: var(--text); }
        .chip:active { transform: translateY(0) scale(.97); }
        .chip.pin .k { background: var(--accent); color: #fff; }
        .empty { font-size: 12px; color: var(--text-3); margin-top: 10px; }

        /* recently opened: day groups, visit-count badge */
        .grp {
            flex-basis: 100%;
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-3);
            letter-spacing: 0.04em;
        }
        .grp:first-child { margin-top: 0; }
        .chip .cnt {
            padding: 0 5px;
            border-radius: 8px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 10px; line-height: 16px;
            font-variant-numeric: tabular-nums;
        }

        /* appearance toolbar in the panel corner: two segmented groups —
           light | dark, and the skin swatches */
        .tools {
            position: absolute;
            top: 12px; right: 12px;
            display: flex; gap: 8px;
            z-index: 1;
            animation: fade .6s ease 1.9s both;
        }
        .seg {
            display: inline-flex;
            padding: 2px;
            gap: 2px;
            border: 1px solid var(--panel-line);
            background: var(--tile);
        }
        .tb {
            width: 24px; height: 24px;
            display: inline-flex; align-items: center; justify-content: center;
            border: 0;
            background: transparent;
            color: var(--text-3);
            padding: 0;
            cursor: pointer;
            transition: background .15s, color .15s, transform .15s;
        }
        .tb svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .tb:hover { color: var(--text); background: var(--tile-hover); }
        .tb:active { transform: scale(.92); }
        .tb.on { color: var(--accent); background: var(--accent-soft); }

        /* skin swatches: a miniature of each skin's surface */
        .sw {
            position: relative;
            width: 24px; height: 24px;
            display: inline-flex; align-items: center; justify-content: center;
            border: 0; background: transparent; padding: 0;
            cursor: pointer;
            transition: background .15s;
        }
        .sw:hover { background: var(--tile-hover); }
        .sw i {
            display: block;
            width: 12px; height: 12px;
            border: 1px solid var(--line-strong);
            background: #fff;
            transition: box-shadow .15s;
        }
        .sw.brutalist i { border: 1.5px solid #14120b; box-shadow: 2px 2px 0 #14120b; width: 11px; height: 11px; }
        .sw.glass i {
            border-color: rgba(255, 255, 255, 0.9);
            border-radius: 3px;
            background: linear-gradient(135deg, rgba(120, 170, 255, 0.85), rgba(255, 140, 190, 0.7) 55%, rgba(110, 230, 210, 0.8));
        }
        /* workspace: a deep brand frame with the light content card inset */
        .sw.workspace i {
            border-color: transparent;
            border-radius: 3px;
            background: linear-gradient(#f0f2f5, #f0f2f5) 6px 3px / 5px 8px no-repeat,
                        color-mix(in srgb, var(--accent) 42%, #151a26);
        }
        /* classic: navy column beside a white bar */
        .sw.classic i {
            border-color: #001529;
            background: linear-gradient(90deg, #001529 45%, #fff 45%);
        }
        html.dark .sw.classic i {
            border-color: #434343;
            background: linear-gradient(90deg, #000 45%, #141414 45%);
        }
        html.dark .sw.workspace i {
            background: linear-gradient(#000, #000) 6px 3px / 5px 8px no-repeat,
                        color-mix(in srgb, var(--accent) 18%, #0d0f14);
        }
        html.dark .sw i { background: #2a2c33; }
        html.dark .sw.brutalist i { border-color: #f5f5f0; box-shadow: 2px 2px 0 #f5f5f0; background: #141414; }
        .sw.on i { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--accent); }
        .sw.brutalist.on i { box-shadow: 2px 2px 0 #14120b, 0 0 0 2px var(--panel), 0 0 0 3.5px var(--accent); }
        html.dark .sw.brutalist.on i { box-shadow: 2px 2px 0 #f5f5f0, 0 0 0 2px var(--panel), 0 0 0 3.5px var(--accent); }

        /* recently opened: the same chip with a remove cross that shows on hover */
        .chip .rm {
            width: 16px; height: 16px;
            margin: 0 -4px 0 -2px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 3px;
            color: var(--text-3);
            font-size: 12px; line-height: 1;
            opacity: 0;
            transition: opacity .15s, background .15s, color .15s;
        }
        .chip:hover .rm { opacity: 1; }
        .chip .rm:hover { background: var(--accent-soft); color: var(--accent); }
        .chip.out {
            transform: scale(.85);
            opacity: 0;
            transition: transform .18s ease, opacity .18s ease;
        }

        @media (prefers-reduced-motion: reduce) {
            .h, .v, .x, .tick, .board, .avatar, .hello, .sub, .stat, .quick { animation-duration: 0s; animation-delay: 0s; }
            .glide { display: none; }
            .panel { transition: none; }
        }
        @media (max-width: 767px) {
            .h, .v, .x, .tick, .glide { display: none; }
            .board { position: static; inset: auto; height: 100%; padding: 12px; perspective: none; }
            .panel { transform: none !important; }
            .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .who { padding-right: 0; padding-top: 30px; }
        }
    </style>
</head>
<body>
    <div class="h h1"></div><div class="h h2"></div>
    <div class="v v1"></div><div class="v v2"></div>
    <div class="x x11"></div><div class="x x12"></div><div class="x x21"></div><div class="x x22"></div>
    <div class="tick t1"></div><div class="tick t2"></div><div class="tick t3"></div><div class="tick t4"></div>
    <div class="glide"></div>

    <div class="board">
        <div class="panel idle" id="panel">
            <div class="tools" id="tools">
                <div class="seg">
                    <button class="tb" id="tbLight" type="button">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
                    </button>
                    <button class="tb" id="tbDark" type="button">
                        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                    </button>
                </div>
                <div class="seg" id="skinSeg">
                    <button class="sw default" data-skin="default" type="button"><i></i></button>
                    <button class="sw classic" data-skin="classic" type="button"><i></i></button>
                    <button class="sw workspace" data-skin="workspace" type="button"><i></i></button>
                    <button class="sw glass" data-skin="liquid-glass" type="button"><i></i></button>
                    <button class="sw brutalist" data-skin="brutalist" type="button"><i></i></button>
                </div>
            </div>
            <div class="who">
                <div class="avatar" id="avatar"></div>
                <div class="txt">
                    <div class="hello" id="hello"></div>
                    <div class="sub">
                        <span id="tenant" hidden></span>
                        <span class="dot" id="tenantDot" hidden></span>
                        <span id="date"></span>
                        <span class="dot"></span>
                        <span class="clock" id="clock"></span>
                    </div>
                </div>
            </div>
            <div class="stats" id="stats"></div>
            <div class="quick">
                <div class="qh" id="qh"></div>
                <div class="chips" id="chips"></div>
            </div>
            <div class="recent">
                <div class="qh" id="rh"></div>
                <div class="chips" id="rchips"></div>
            </div>
        </div>
    </div>

<script>
(function () {
    // ── shell integration ────────────────────────────────────────────────────
    var parentWin = null, parentRoot = null;
    try {
        if (window.parent && window.parent !== window) {
            parentWin = window.parent;
            parentRoot = parentWin.document.documentElement;
        }
    } catch (e) { /* cross-origin embed */ }

    function syncTheme() {
        if (!parentRoot) return;
        document.documentElement.classList.toggle("dark", parentRoot.classList.contains("dark"));
        var accent = getComputedStyle(parentRoot).getPropertyValue("--ant-primary-color").trim();
        if (accent) {
            var s = document.documentElement.style;
            s.setProperty("--accent", accent);
            s.setProperty("--accent-soft", "color-mix(in srgb, " + accent + " 12%, transparent)");
            s.setProperty("--accent-line", "color-mix(in srgb, " + accent + " 38%, transparent)");
            s.setProperty("--tint", "color-mix(in srgb, " + accent + " 7%, transparent)");
        }
    }
    syncTheme();
    if (parentRoot) new MutationObserver(syncTheme).observe(parentRoot, {attributes: true, attributeFilter: ["class", "style"]});

    var params = new URLSearchParams(location.search);
    var token = params.get("_token") || "";
    var lang = params.get("_lang") || "zh-CN";
    var api = "erupt-api", attach = "erupt-attachment";
    try {
        var cfg = parentWin && parentWin.eruptSiteConfig;
        if (cfg && cfg.domain) { api = cfg.domain + "/erupt-api"; attach = cfg.domain + "/erupt-attachment"; }
        if (cfg && cfg.fileDomain) attach = cfg.fileDomain;
    } catch (e) { /* keep relative */ }

    // ── strings ─────────────────────────────────────────────────────────────
    var L = {
        "zh-CN": {morning: "早上好", noon: "中午好", afternoon: "下午好", evening: "晚上好", night: "夜深了",
            menus: "可访问菜单", models: "数据模型", unread: "未读通知", pinned: "常用菜单", quick: "常用",
            recent: "快捷入口", home: "首页", none: "在左侧菜单点击图钉，把常用功能钉在这里",
            opened: "最近打开", openedNone: "打开过的菜单会出现在这里",
            today: "今天", yesterday: "昨天", earlier: "更早",
            dark: "深色模式", light: "浅色模式", skin: "主题风格", skinDefault: "默认"},
        "zh-TW": {morning: "早上好", noon: "中午好", afternoon: "下午好", evening: "晚上好", night: "夜深了",
            menus: "可存取選單", models: "資料模型", unread: "未讀通知", pinned: "常用選單", quick: "常用",
            recent: "快捷入口", home: "首頁", none: "在左側選單點擊圖釘，把常用功能釘在這裡",
            opened: "最近開啟", openedNone: "開啟過的選單會出現在這裡",
            today: "今天", yesterday: "昨天", earlier: "更早",
            dark: "深色模式", light: "淺色模式", skin: "主題風格", skinDefault: "預設"},
        "en-US": {morning: "Good morning", noon: "Good noon", afternoon: "Good afternoon", evening: "Good evening", night: "Still up",
            menus: "Menus", models: "Data models", unread: "Unread notices", pinned: "Pinned menus", quick: "Pinned",
            recent: "Quick access", home: "Home", none: "Pin a menu from the sidebar to keep it here",
            opened: "Recently opened", openedNone: "Menus you open will show up here",
            today: "Today", yesterday: "Yesterday", earlier: "Earlier",
            dark: "Dark mode", light: "Light mode", skin: "Skin", skinDefault: "Default"}
    };
    var T = L[lang] || L["en-US"];

    // ── helpers ─────────────────────────────────────────────────────────────
    function $(id) { return document.getElementById(id); }
    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function fetchJson(url, opts) {
        opts = opts || {};
        opts.headers = Object.assign({token: token, lang: lang}, opts.headers || {});
        return fetch(url, opts).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
            .then(function (t) { return t ? JSON.parse(t) : null; });
    }
    function isTenant(t) { return t.indexOf("t_") === 0 || t.split(".").length === 3; }
    function greeting() {
        var h = new Date().getHours();
        return h < 5 ? T.night : h < 11 ? T.morning : h < 13 ? T.noon : h < 18 ? T.afternoon : h < 23 ? T.evening : T.night;
    }
    function joinPath(type, v) {
        switch (type) {
            case "table": return "/build/table/" + v;
            case "tree": return "/build/tree/" + v;
            case "form": return "/build/form/" + v;
            case "bi": return "/bi/" + v;
            case "cube": return "/cube/" + v;
            case "tpl": return "/tpl/" + v;
            case "mtpl": return "/mtpl/" + v;
            case "router": return v;
            case "aiCanvas": return "/ai/canvas/" + v;
            case "link": return "/site/" + encodeURIComponent(window.btoa(encodeURIComponent(v)));
            case "mlink": return "/msite/" + encodeURIComponent(window.btoa(encodeURIComponent(v)));
            case "fill": return v.charAt(0) === "/" ? "/fill" + v : "/fill/" + v;
            case "newWindow": case "selfWindow": return "/" + v;
        }
        return null;
    }
    function menuPath(type, value) {
        var v = value || "";
        var p = joinPath(type, v);
        if (p == null) return null;
        return (v.indexOf("fill=1") !== -1 || v.indexOf("fill=true") !== -1) ? "/fill" + p : p;
    }
    function go(node) {
        if (!node || !parentWin) return;
        if (node.type === "newWindow") { window.open(node.value); return; }
        if (node.type === "selfWindow") { parentWin.location.href = node.value; return; }
        var path = menuPath(node.type, node.value);
        if (path) parentWin.location.hash = "#" + path;
    }
    function countUp(node, to) {
        var start = null, dur = 900;
        function step(ts) {
            if (start === null) start = ts;
            var p = Math.min(1, (ts - start) / dur);
            var e = 1 - Math.pow(1 - p, 3);
            node.textContent = Math.round(to * e).toLocaleString();
            if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    // ── clock ────────────────────────────────────────────────────────────────
    (function clock() {
        var d = new Date(), pad = function (n) { return String(n).padStart(2, "0"); };
        $("clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
        try {
            $("date").textContent = d.toLocaleDateString(lang, {month: "long", day: "numeric", weekday: "long"});
        } catch (e) { $("date").textContent = d.toLocaleDateString(); }
        setTimeout(clock, 1000 - d.getMilliseconds());
    })();
    $("hello").textContent = greeting();

    // ── pointer: tilt + sheen ───────────────────────────────────────────────
    var panel = $("panel");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduce) {
        var tx = 0, ty = 0, cx = 0, cy = 0, inside = false;
        panel.addEventListener("mousemove", function (e) {
            var r = panel.getBoundingClientRect();
            var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
            tx = (px - 0.5) * 2; ty = (py - 0.5) * 2; inside = true;
            panel.classList.remove("idle");
            panel.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
            panel.style.setProperty("--my", (py * 100).toFixed(1) + "%");
        });
        panel.addEventListener("mouseleave", function () { tx = 0; ty = 0; inside = false; panel.classList.add("idle"); });
        (function tick() {
            cx += (tx - cx) * 0.08; cy += (ty - cy) * 0.08;
            panel.style.setProperty("--ry", (cx * 3).toFixed(2) + "deg");
            panel.style.setProperty("--rx", (-cy * 2.5).toFixed(2) + "deg");
            requestAnimationFrame(tick);
        })();
    }

    // ── appearance toolbar: same globals / classes / storage as the settings drawer ──
    (function tools() {
        if (!parentRoot) { $("tools").hidden = true; return; }
        // site config may lock the appearance (eruptSiteConfig.theme.customizable = false):
        // light/dark stays a per-user choice, the skin swatches go
        var siteTheme = (parentWin.eruptSiteConfig && parentWin.eruptSiteConfig.theme) || {};
        var skinLocked = siteTheme.customizable === false;
        $("skinSeg").hidden = skinLocked;
        var SKINS = [
            {value: "default", cls: null, key: null, label: T.skinDefault},
            {value: "classic", cls: "classic", key: "classic", label: "Classic"},
            {value: "workspace", cls: "workspace", key: "workspace", label: "Workspace"},
            {value: "liquid-glass", cls: "liquid-glass", key: "liquid-glass", label: "Liquid Glass"},
            {value: "brutalist", cls: "brutalist-theme", key: "brutalist-theme", label: "Brutalist"}
        ];
        function currentSkin() {
            for (var i = 1; i < SKINS.length; i++) if (parentRoot.classList.contains(SKINS[i].cls)) return SKINS[i];
            return SKINS[0];
        }
        var swatches = Array.prototype.slice.call(document.querySelectorAll("#skinSeg .sw"));
        function paint() {
            var dark = parentRoot.classList.contains("dark");
            $("tbLight").classList.toggle("on", !dark);
            $("tbLight").title = T.light;
            $("tbDark").classList.toggle("on", dark);
            $("tbDark").title = T.dark;
            var skin = currentSkin();
            swatches.forEach(function (b) {
                var def = SKINS.filter(function (sk) { return sk.value === b.getAttribute("data-skin"); })[0];
                b.classList.toggle("on", def === skin);
                b.title = T.skin + " · " + def.label;
            });
        }
        function setDark(dark) {
            try { parentWin.localStorage.setItem("dark-theme", String(dark)); } catch (e) {}
            if (typeof parentWin.eruptApplyDarkTheme === "function") parentWin.eruptApplyDarkTheme(dark);
        }
        $("tbLight").addEventListener("click", function () { setDark(false); });
        $("tbDark").addEventListener("click", function () { setDark(true); });
        swatches.forEach(function (b) {
            b.addEventListener("click", function () {
                var next = SKINS.filter(function (sk) { return sk.value === b.getAttribute("data-skin"); })[0];
                if (typeof parentWin.eruptApplySkin === "function") {
                    // the app's own switch: also swaps the theme color slot and the header bar
                    parentWin.eruptApplySkin(next.value);
                } else {
                    SKINS.forEach(function (sk) {
                        if (!sk.cls) return;
                        parentRoot.classList.toggle(sk.cls, sk === next);
                        try { parentWin.localStorage.setItem(sk.key, String(sk === next)); } catch (e) {}
                    });
                }
                paint();
            });
        });
        new MutationObserver(paint).observe(parentRoot, {attributes: true, attributeFilter: ["class"]});
        paint();
    })();

    // ── data: who am I ───────────────────────────────────────────────────────
    var user = null, indexNode = null, userReady = false;
    fetchJson(api + (isTenant(token) ? "/tenant/userinfo" : "/userinfo")).then(function (u) {
        user = u || {};
        var name = user.nickname || "";
        var hello = $("hello");
        hello.textContent = greeting() + (name ? (lang.indexOf("zh") === 0 ? "，" : ", ") : "");
        if (name) hello.appendChild(el("b", null, name));
        if (user.tenantName) { $("tenant").textContent = user.tenantName; $("tenant").hidden = false; $("tenantDot").hidden = false; }
        var av = $("avatar");
        if (user.avatar) {
            var src = /^https?:\/\//.test(user.avatar) ? user.avatar : attach + "/" + user.avatar.replace(/^\/+/, "");
            src += (src.indexOf("?") === -1 ? "?" : "&") + "_token=" + encodeURIComponent(token);
            var img = new Image();
            img.onload = function () { av.textContent = ""; av.appendChild(img); };
            img.onerror = function () { av.textContent = name.charAt(0); };
            img.src = src;
        }
        if (!av.firstChild) av.textContent = name.charAt(0);
        if (user.indexMenuType && user.indexMenuValue) indexNode = {type: user.indexMenuType, value: user.indexMenuValue, name: T.home};
        userReady = true;
        placeChips();
    }).catch(function () { userReady = true; placeChips(); });

    // ── data: what can I reach ──────────────────────────────────────────────
    var leaves = [], tables = 0, menusReady = false;
    fetchJson(api + (isTenant(token) ? "/tenant/menu" : "/menu")).then(function (menus) {
        if (!Array.isArray(menus)) return;
        var nodes = menus.filter(function (m) { return m.type !== "api" && m.type !== "button"; });
        var byId = {}, hasKids = {};
        nodes.forEach(function (m) { byId[m.id] = m; });
        nodes.forEach(function (m) { if (m.pid != null && byId[m.pid]) hasKids[m.pid] = true; });
        leaves = nodes.filter(function (m) { return !hasKids[m.id] && menuPath(m.type, m.value); });
        tables = leaves.filter(function (m) { return m.type === "table"; }).length;
        menusReady = true;
        renderStats();
        placeChips();
        placeRecent();
    }).catch(function () { menusReady = true; renderStats(); placeChips(); placeRecent(); });

    // ── data: unread notices. The tile exists only when the backend reports the
    //    notice module (erupt-app properties["erupt-notice"]); a project without it
    //    has no /notice endpoints at all, so nothing is requested and nothing shown.
    var unread = null, appReady = false, noticeOn = false;
    fetchJson(api + "/erupt-app").then(function (app) {
        noticeOn = !!(app && app.properties && app.properties["erupt-notice"]) && !isTenant(token);
    }).catch(function () { noticeOn = false; }).then(function () {
        appReady = true;
        renderStats();
        if (!noticeOn) return;
        fetchJson(api + "/notice/unread-count").then(function (r) {
            unread = r && typeof r.data === "number" ? r.data : 0;
            renderStats();
        }).catch(function () {
            // the endpoint is missing or refused after all: drop the tile instead of showing 0
            var t = $("unreadStat");
            if (t) t.remove();
        });
    });

    // ── pinned menus (the sidebar's pushpins, kept in the shell's localStorage) ─
    function pinnedKeys() {
        try { return JSON.parse(parentWin.localStorage.getItem("erupt_menu_favorites") || "[]"); } catch (e) { return []; }
    }

    var statsDone = false;
    function renderStats() {
        if (!menusReady || !appReady) return;
        var box = $("stats");
        if (!statsDone) {
            statsDone = true;
            box.appendChild(stat(leaves.length, T.menus));
            box.appendChild(stat(tables, T.models));
            if (noticeOn) {
                var u = stat(unread == null ? 0 : unread, T.unread); u.id = "unreadStat"; box.appendChild(u);
            }
            var p = stat(pinnedKeys().length, T.pinned); box.appendChild(p);
        } else if (unread != null && $("unreadStat")) {
            var n = $("unreadStat").querySelector(".n");
            countUp(n, unread);
            n.classList.toggle("badge", unread > 0);
        }
    }
    function stat(value, label) {
        var s = el("div", "stat");
        var n = el("div", "n", "0");
        s.appendChild(n);
        s.appendChild(el("div", "l", label));
        setTimeout(function () { countUp(n, value); }, 1500);
        return s;
    }

    var chipsDone = false;
    function placeChips() {
        if (!menusReady || !userReady || chipsDone) return;
        chipsDone = true;
        var keys = pinnedKeys();
        var pinned = [];
        keys.forEach(function (k) {
            var hit = leaves.filter(function (m) { return menuPath(m.type, m.value) === k || m.name === k; })[0];
            if (hit) pinned.push(hit);
        });
        var list = pinned.length ? pinned : leaves.slice(0, 8);
        $("qh").textContent = pinned.length ? T.quick : T.recent;
        var box = $("chips");
        if (indexNode) box.appendChild(chip(indexNode, true));
        list.forEach(function (m) { box.appendChild(chip(m, false)); });
        if (!list.length && !indexNode) box.appendChild(el("div", "empty", T.none));
    }
    // ── recently opened (the layout appends to erupt_menu_recent on every navigation) ──
    var RECENT_KEY = "erupt_menu_recent";
    function recentList() {
        try { return JSON.parse(parentWin.localStorage.getItem(RECENT_KEY) || "[]"); } catch (e) { return []; }
    }
    function recentRemove(link) {
        try {
            parentWin.localStorage.setItem(RECENT_KEY, JSON.stringify(recentList().filter(function (r) { return r.link !== link; })));
        } catch (e) { /* storage unavailable */ }
    }
    var recentDone = false;
    function placeRecent() {
        if (!menusReady || recentDone) return;
        recentDone = true;
        $("rh").textContent = T.opened;
        var box = $("rchips");
        // only menus the account can still reach, matched by their route
        var byPath = {};
        leaves.forEach(function (m) { byPath[menuPath(m.type, m.value)] = m; });
        var items = recentList().filter(function (r) { return byPath[r.link]; });
        if (!items.length) { box.appendChild(el("div", "empty", T.openedNone)); return; }
        // today / yesterday / earlier, by local calendar day
        var dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
        var today = dayStart.getTime(), yesterday = today - 86400000;
        var lastGroup = null;
        items.forEach(function (r) {
            var g = r.at >= today ? T.today : r.at >= yesterday ? T.yesterday : T.earlier;
            if (g !== lastGroup) { box.appendChild(el("div", "grp", g)); lastGroup = g; }
            var node = byPath[r.link];
            var c = chip(node, false);
            if (r.count > 1) c.appendChild(el("span", "cnt", String(r.count)));
            try { c.title = node.name + "  ·  " + new Date(r.at).toLocaleString(lang); } catch (e) { /* keep name */ }
            var rm = el("span", "rm", "×");
            rm.title = "";
            rm.addEventListener("click", function (e) {
                e.stopPropagation();
                recentRemove(r.link);
                c.classList.add("out");
                setTimeout(function () {
                    var prev = c.previousElementSibling, next = c.nextElementSibling;
                    c.remove();
                    if (prev && prev.classList.contains("grp") && (!next || next.classList.contains("grp"))) prev.remove();
                    if (!box.querySelector(".chip")) { box.textContent = ""; box.appendChild(el("div", "empty", T.openedNone)); }
                }, 180);
            });
            c.appendChild(rm);
            box.appendChild(c);
        });
    }

    function chip(node, isHome) {
        var c = el("div", "chip" + (isHome ? " pin" : ""));
        c.appendChild(el("span", "k", (node.name || "?").trim().charAt(0)));
        c.appendChild(el("span", null, node.name || ""));
        c.title = node.name || "";
        c.addEventListener("click", function () { go(node); });
        return c;
    }
})();
</script>
</body>
</html>
