<html>
<head>
    <meta charset="UTF-8">
    <link href="/server/xterm.min.css" rel="stylesheet">
    <style>
        * {
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>
<div id="terminal"></div>
<script src="/server/xterm.min.js"></script>
<script>
    function get_box_size() {
        let init_width = 9;
        let init_height = 22;
        let windows_width = document.getElementById('terminal').clientWidth;
        let windows_height = window.innerHeight;
        return {
            cols: Math.floor(windows_width / init_width),
            rows: Math.floor(windows_height / init_height)
        }
    }

    window.onresize = function () {
        var size = get_box_size();
        term.resize(size.cols, size.rows) //调整页面终端大小
    }

    Terminal.prototype.prefix = " [root@erupt ~] # ";
    Terminal.prototype.command = "";
    var size = get_box_size();
    var term = new Terminal({
        rendererType: "canvas", //渲染类型
        rows: size.rows,
        cols: size.cols,
        fontSize: 19,
        convertEol: true,  //启用时，光标将设置为下一行的开头
        scrollback: 100,    //终端中的回滚量
        disableStdin: false,  //是否应禁用输入
        cursorStyle: 'block', //光标样式
        cursorBlink: true,    //光标闪烁
        screenKeys: false,
        useStyle: true,
        theme: {
            foreground: '#fff', //字体
            background: '#1c2a35', //背景色
            cursor: 'help', //设置光标
        }
    });
    term.write("\x1B[1;3;31m " +
        "                             __\n" +
        "                            /\\ \\__   \n" +
        "   __   _ __   __  __  _____\\ \\ ,_\\  \n" +
        " /'__`\\/\\`'__\\/\\ \\/\\ \\/\\ '__`\\ \\ \\/  \n" +
        "/\\  __/\\ \\ \\/ \\ \\ \\_\\ \\ \\ \\L\\ \\ \\ \\_ \n" +
        "\\ \\____\\\\ \\_\\  \\ \\____/\\ \\ ,__/\\ \\__\\\n" +
        " \\/____/ \\/_/   \\/___/  \\ \\ \\/  \\/__/\n" +
        "                         \\ \\_\\       \n" +
        "                          \\/_/\n" +
        "\x1B[0m");
    term.writeln("");
    term.writeln(" 欢迎您使用 Erupt-Docker 容器终端已为您连接成功 ............. OK  🚀 ")
    term.open(document.getElementById('terminal'));
    term.writeln("");
    term.write(term.prefix)
    term.on("key", function (data, ev) {
        const printable = !ev.altKey && !ev.ctrlKey && !ev.metaKey
        if (ev.keyCode === 13) {
            if (!term.command) {
                term.writeln("")
            } else if (term.command === 'clear' || term.command === 'cls') {
                term.clear();
                term.writeln("")
            } else {
                term.writeln("")
                term.writeln("\x1B[1;3;31m Nice\x1B[0m")
            }
            term.command = ""
            term.write(term.prefix)
        } else if (ev.keyCode === 8) {
            if (term.command) {
                term.command = term.command.substr(0, term.command.length - 1);
                term.write('\b \b')
            }
        } else if (ev.keyCode === 9) {

        } else if (printable) {
            term.command += data;
            term.write(data)
        }
    })
</script>
</body>
</html>
