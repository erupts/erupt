name: Feature request
description: Suggest an idea for Erupt
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Erupt makes hard today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Ideally sketch the annotation or API you would like to write.
      value: |
        ```java
        @EruptField(
            views = @View(title = "..."),
            edit = @Edit(title = "...", type = EditType.xxx)
        )
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, e.g. DataProxy, OperationHandler, custom template.

  - type: textarea
    id: context
    attributes:
      label: Additional context
